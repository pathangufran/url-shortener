services:

  postgres:
    image: postgres:16
    container_name: url_shortener_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  django:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url_shortener_django
    restart: unless-stopped

    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3} --threads ${GUNICORN_THREADS:-2}
      --timeout ${GUNICORN_TIMEOUT:-60} --access-logfile - --error-logfile -"

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  celery:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url_shortener_celery
    restart: unless-stopped

    command: celery -A config worker --loglevel=info

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url_shortener_celery_beat
    restart: unless-stopped

    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
